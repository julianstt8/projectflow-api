version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The project targets .NET 10 (LTS). Moving to a new .NET major is a deliberate change, not a weekly update.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: [version-update:semver-major]
      - dependency-name: "EFCore.NamingConventions"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    # The SDK and runtime images must stay on the .NET major in global.json and Directory.Build.props.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: [version-update:semver-major]
